<style>
    div{
        background-color: blue;
        width: 100px;
        height: 100px;
        transition: 2s;
    }
    .max{
        width: 200px;
    }
</style>
<div id="box"></div> <br>
<button onclick="change()">Change color</button>
<script>
    var a=document.getElementById("box")
    function change(){
        a.style.backgroundColor="purple"
        a.setAttribute("class","max")
    }
</script>
